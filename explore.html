<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Games | Gaming Galaxy</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="logo">🎮 Gaming Galaxy</div>

      <button
        type="button"
        class="menu-toggle"
        id="menuToggle"
        aria-label="Open menu"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="menu menu--desktop" aria-label="Main">
        <a href="index.html" class="nav-link-desktop">Home</a>
        <button type="button" id="searchBtn">Search</button>
        <button type="button" id="signinBtn">Sign in</button>
        <button type="button" id="settingsBtn">Settings</button>
      </nav>
    </header>

    <div id="mobileMenuBackdrop" class="mobile-menu-backdrop hidden" aria-hidden="true"></div>

    <div id="mobileMenu" class="mobile-menu hidden" aria-hidden="true">
      <a href="index.html" class="mobile-menu-link">Home</a>
      <button type="button" id="mobileSearchBtn">Search</button>
      <button type="button" id="mobileSigninBtn">Sign in</button>
      <button type="button" id="mobileSettingsBtn">Settings</button>
      <button type="button" class="mobile-menu-close" id="closeMobileMenu">Close</button>
    </div>

    <div id="searchBox" class="search-box hidden">
      <input
        type="search"
        id="searchInput"
        placeholder="Search games by title or genre…"
        autocomplete="off"
      />
    </div>

    <div id="signinModal" class="modal hidden">
      <div class="modal-content">
        <h2>Sign In</h2>
        <input type="text" placeholder="Username" />
        <input type="password" placeholder="Password" />
        <button type="button">Login</button>
        <button type="button" id="closeSignin">Close</button>
      </div>
    </div>

    <div id="settingsOverlay" class="settings-overlay hidden" aria-hidden="true">
      <div id="settingsPanel" class="settings-panel" role="dialog" aria-labelledby="settingsTitle">
        <button type="button" class="settings-close" id="closeSettings" aria-label="Close settings">×</button>
        <p id="settingsTitle">⚙️ Settings</p>
        <button type="button" class="settings-action-btn" id="darkModeBtn">Toggle Dark Mode</button>

        <div class="settings-field">
          <label for="maxPrice">Max Price ($)</label>
          <input type="number" id="maxPrice" placeholder="e.g. 60" min="0" />
        </div>

        <div class="settings-field">
          <label for="minRating">Minimum Rating</label>
          <input
            type="number"
            id="minRating"
            step="0.1"
            min="0"
            max="10"
            placeholder="e.g. 8.5"
          />
          <small>Only applies when using a RAWG API key (see config.example.js).</small>
        </div>

        <div class="settings-field">
          <label for="platform">Platform</label>
          <select id="platform">
            <option value="">Any</option>
            <option value="PC">PC</option>
            <option value="PS5">PS5</option>
            <option value="Xbox">Xbox</option>
          </select>
        </div>

        <label class="settings-check">
          <input type="checkbox" id="animationsToggle" />
          Enable Animations
        </label>

        <div class="settings-field">
          <label for="fontSize">Font Size</label>
          <select id="fontSize">
            <option value="small">Small</option>
            <option value="normal">Normal</option>
            <option value="large">Large</option>
          </select>
        </div>

        <div class="settings-field">
          <label for="themeColor">Theme Color</label>
          <select id="themeColor">
            <option value="red">Red</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
          </select>
        </div>

        <button type="button" class="settings-action-btn" id="resetSettings">Reset Settings</button>
      </div>
    </div>

    <main class="explore-page">
      <h1>Explore Games</h1>
      <p>Filter the full catalog loaded from the internet.</p>

      <section class="filters">
        <div class="filter-group">
          <label for="filterPrice">Price</label>
          <select id="filterPrice">
            <option value="Any">Any</option>
            <option value="Free">Free</option>
            <option value="Under $30">Under $30</option>
            <option value="$30 - $60">$30 - $60</option>
            <option value="$60+">$60+</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filterGenre">Genre</label>
          <select id="filterGenre">
            <option value="Any">Any</option>
            <option value="Action">Action</option>
            <option value="Shooter">Shooter</option>
            <option value="MMORPG">MMORPG</option>
            <option value="RPG">RPG</option>
            <option value="Strategy">Strategy</option>
            <option value="Sports">Sports</option>
            <option value="Racing">Racing</option>
            <option value="Fighting">Fighting</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filterRating">Rating</label>
          <select id="filterRating">
            <option value="Any">Any</option>
            <option value="8">8+</option>
            <option value="9">9+</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filterPlatform">Platform</label>
          <select id="filterPlatform">
            <option value="Any">Any</option>
            <option value="PC">PC</option>
            <option value="PS5">PS5</option>
            <option value="Xbox">Xbox</option>
          </select>
        </div>

        <button type="button" class="primary-btn" id="applyExploreFilters">
          Apply Filters
        </button>
      </section>

      <section class="games-grid"></section>
    </main>

    <footer class="footer">
      <div class="footer-bottom">
        <p>© 2025 Gaming Galaxy</p>
      </div>
    </footer>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="ui.js"></script>
    <script src="explore.js"></script>
  </body>
</html>
